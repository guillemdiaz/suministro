version: 2

models:
  - name: int_shortages_enriched
    description: One row per national_drug_code per snapshot_date, joining the
                 daily shortage list to its presentation and medication details.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - national_drug_code
              - snapshot_date
    columns:
      - name: national_drug_code
        data_tests:
          - not_null

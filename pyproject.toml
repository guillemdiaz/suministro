# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "dags/dbt/cima_dbt/target",
    "dags/dbt/cima_dbt/dbt_packages",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

# SQLFluff configuration
[tool.sqlfluff.core]
dialect = "bigquery"
templater = "dbt"
exclude_rules = "L034"
ignore_templated_areas = true

[tool.sqlfluff.templater.dbt]
project_dir = "dags/dbt/cima_dbt"
profiles_dir = "dags/dbt/cima_dbt"
profile = "cima_dbt"
target = "dev"

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = [
    "dags"
]

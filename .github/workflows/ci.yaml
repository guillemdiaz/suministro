name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: dags/dbt/cima_dbt

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # CI profile that uses the authenticated session
      - name: Create CI dbt profile
        run: |
          cat <<EOF > dags/dbt/cima_dbt/profiles.yml
          cima_dbt:
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: guillemdiaz-data
                dataset: suministro_dev
                location: europe-southwest1
            target: dev
          EOF

      - name: Install dbt dependencies
        run: dbt deps
        working-directory: dags/dbt/cima_dbt

      - name: Run sqlfluff (SQL lint)
        run: sqlfluff lint dags/dbt/cima_dbt/models

      - name: Run Pytest (DAG integrity)
        run: pytest tests/ -v
